# OSV-Scanner suppressions — https://google.github.io/osv-scanner/configuration/
#
# Auto-loaded by OSV-Scanner for lockfiles in THIS directory (it does not
# propagate to child dirs) — here that is `semgrep-requirements.txt`.
#
# `mcp` is a hard, transitive dependency of Semgrep (see the "# via semgrep"
# markers in semgrep-requirements.txt): Semgrep pins `mcp==1.29.0` *exactly*, and
# that pin is still in place in Semgrep's latest release, so `mcp` cannot be
# bumped without dropping Semgrep. ParallaX runs Semgrep only as a CLI SAST
# scanner (`semgrep scan --config p/rust`, see workflows/semgrep.yml) and never
# starts an MCP server, so these MCP *server-transport* / *task-handler*
# vulnerabilities are unreachable in this repo. Suppress them here until Semgrep
# upstream bumps its `mcp` pin; the corresponding Dependabot alerts are dismissed
# as not-affected for the same reason. cargo-deny remains the blocking gate for
# the Rust dependency tree; this only scopes OSV noise from the Semgrep CI pin.

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv" # CVE-2026-59951 — unbounded session accumulation in StreamableHTTP transport
reason = "Semgrep hard-pins mcp==1.29.0 (fix is 1.30.0); run as a CLI scanner only, the MCP server is never started"

# `opentelemetry-api` is likewise pinned by Semgrep (`~=1.37.0`, still the pin in
# its latest release; the fix is 1.45.1). Semgrep runs as a CLI that never
# accepts inbound requests, so no incoming W3C `tracestate` header is parsed here.

[[IgnoredVulns]]
