    patterns:
      - pattern-inside: 'impl TransportParameters { ... }'
      - pattern-inside: 'fn read(...) { ... }'
      - pattern: &peer_ack_tp_fields |
          Self {
            initial_max_data: $INIT_INITIAL_MAX_DATA,
            initial_max_stream_data_bidi_local: $INIT_INITIAL_MAX_STREAM_DATA_BIDI_LOCAL,
