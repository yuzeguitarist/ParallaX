rules:
  - id: observe-peer-ack-prevalidate-definition
    languages: [rust]
    severity: INFO
    message: Complete early parser scope, distinct from authenticated adoption.
    pattern: 'fn prevalidate_peer_transport_params(...) { ... }'
  - id: observe-peer-ack-prevalidate-read
    languages: [rust]
    severity: INFO
    message: One actual early TP parse.
    patterns:
      - pattern-inside: 'fn prevalidate_peer_transport_params(...) { ... }'
      - pattern: 'TransportParameters::read(...)'
  - id: observe-peer-ack-prevalidate-validated
    languages: [rust]
    severity: INFO
    message: One successful validation flag commit.
    patterns:
      - pattern-inside: 'fn prevalidate_peer_transport_params(...) { ... }'
      - pattern: 'self.peer_transport_params_prevalidated = ...'
  - id: observe-peer-ack-prevalidate-getter
    languages: [rust]
    severity: INFO
    message: Use this TLS handshake's getter, never ticket state.
    patterns:
      - pattern-inside: 'fn prevalidate_peer_transport_params(...) { ... }'
      - pattern: 'self.tls.peer_transport_parameters()'
  - id: observe-peer-ack-prevalidate-close
    languages: [rust]
    severity: INFO
    message: One actual terminal transport-close call on parse failure.
    patterns:
      - pattern-inside: 'fn prevalidate_peer_transport_params(...) { ... }'
      - pattern: 'self.close_transport(...)'
  - id: observe-peer-ack-prevalidate-return
    languages: [rust]
    severity: INFO
    message: Count full return nodes including closure tails.
    patterns:
      - pattern-inside: 'fn prevalidate_peer_transport_params(...) { ... }'
      - pattern: 'return $VALUE'
  - id: observe-peer-ack-prevalidate-reason
    languages: [rust]
    severity: INFO
    message: Complete error-reason expression; a canonical format tail must not excuse an enclosing side effect.
    patterns:
      - pattern-inside: 'fn prevalidate_peer_transport_params(...) { ... }'
      - pattern: 'transport_error(0x08, 0x06, $EARLY_REASON)'
      - focus-metavariable: $EARLY_REASON
  - id: observe-peer-ack-prevalidate-missing
    languages: [rust]
    severity: INFO
    message: Rust let-else missing-input return, which Semgrep does not normalize as an ordinary return node.
    patterns:
      - pattern-inside: 'fn prevalidate_peer_transport_params(...) { ... }'
      - pattern: 'let Some(blob) = self.tls.peer_transport_parameters() else { return Ok(()); };'
  - id: observe-peer-ack-apply-definition
    languages: [rust]
    severity: INFO
    message: Complete reviewed function scope.
    pattern: 'fn apply_authenticated_peer_ack_params(...) { ... }'
  - id: observe-peer-ack-apply-read
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn apply_authenticated_peer_ack_params(...) { ... }'
      - pattern: 'TransportParameters::read(...)'
  - id: observe-peer-ack-apply-exponent
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn apply_authenticated_peer_ack_params(...) { ... }'
      - pattern: 'self.peer_ack_delay_exponent = ...'
  - id: observe-peer-ack-apply-maximum
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn apply_authenticated_peer_ack_params(...) { ... }'
      - pattern: 'self.peer_max_ack_delay = ...'
  - id: observe-peer-ack-apply-applied
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn apply_authenticated_peer_ack_params(...) { ... }'
      - pattern: 'self.peer_ack_params_applied = ...'
  - id: observe-peer-ack-apply-return
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn apply_authenticated_peer_ack_params(...) { ... }'
      - pattern: 'return $VALUE'
  - id: observe-peer-ack-apply-authenticated
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn apply_authenticated_peer_ack_params(...) { ... }'
      - pattern: 'self.tls.is_handshaking()'
  - id: observe-peer-ack-decode-definition
    languages: [rust]
    severity: INFO
    message: Complete reviewed function scope.
    pattern: 'fn decoded_ack_delay(...) { ... }'
  - id: observe-peer-ack-decode-duration
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn decoded_ack_delay(...) { ... }'
      - pattern: 'Duration::new(...)'
  - id: observe-peer-ack-decode-return
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn decoded_ack_delay(...) { ... }'
      - pattern: 'return $VALUE'
  - id: observe-peer-ack-cap-definition
    languages: [rust]
    severity: INFO
    message: Complete reviewed function scope.
    pattern: 'fn cap_decoded_peer_ack_delay(...) { ... }'
  - id: observe-peer-ack-cap-return
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn cap_decoded_peer_ack_delay(...) { ... }'
      - pattern: 'return $VALUE'
  - id: observe-peer-ack-cap-clamp
    languages: [rust]
    severity: INFO
    message: One reviewed clamp; deep expression matching cannot hide a second preconfirmation clamp.
    patterns:
      - pattern-inside: 'fn cap_decoded_peer_ack_delay(...) { ... }'
      - pattern: 'delay.min(peer_max)'
  - id: observe-peer-ack-wrapper-definition
    languages: [rust]
    severity: INFO
    message: Complete production decoding-to-policy wrapper.
    pattern: 'fn ack_delay_for_recovery(...) { ... }'
  - id: observe-peer-ack-wrapper-decode
    languages: [rust]
    severity: INFO
    message: One actual wire decoder.
    patterns:
      - pattern-inside: 'fn ack_delay_for_recovery(...) { ... }'
      - pattern: 'decoded_ack_delay(...)'
  - id: observe-peer-ack-wrapper-cap
    languages: [rust]
    severity: INFO
    message: One actual post-decoding cap policy.
    patterns:
      - pattern-inside: 'fn ack_delay_for_recovery(...) { ... }'
      - pattern: 'cap_decoded_peer_ack_delay(...)'
  - id: observe-peer-ack-eligible-definition
    languages: [rust]
    severity: INFO
    message: Complete reviewed function scope.
    pattern: 'fn pto_space_eligible(...) { ... }'
  - id: observe-peer-ack-eligible-return
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn pto_space_eligible(...) { ... }'
      - pattern: 'return $VALUE'
  - id: observe-peer-ack-extra-definition
    languages: [rust]
    severity: INFO
    message: Complete reviewed function scope.
    pattern: 'fn peer_ack_delay_for_pto(...) { ... }'
  - id: observe-peer-ack-extra-return
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn peer_ack_delay_for_pto(...) { ... }'
      - pattern: 'return $VALUE'
  - id: observe-peer-ack-receive-definition
    languages: [rust]
    severity: INFO
    message: Complete reviewed function scope.
    pattern: 'fn process_packet(...) { ... }'
  - id: observe-peer-ack-receive-apply
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
      - pattern-inside: 'fn process_packet(...) { ... }'
      - pattern: 'self.apply_authenticated_peer_ack_params()'
  - id: observe-peer-ack-receive-prevalidate
    languages: [rust]
    severity: INFO
    message: One early validation before completing this packet.
    patterns:
      - pattern-inside: 'fn process_packet(...) { ... }'
      - pattern: 'self.prevalidate_peer_transport_params()'
  - id: observe-peer-ack-rtt-definition
    languages: [rust]
    severity: INFO
