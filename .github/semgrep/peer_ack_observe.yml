      - pattern-inside: 'fn read(...) { ... }'
      - pattern: 'tp.max_ack_delay_ms = ...'
  - id: observe-peer-ack-initial-connection-definition
    languages: [rust]
    severity: INFO
    message: Complete reviewed initializer owner.
    patterns:
      - pattern: 'fn new_inner(...) { ... }'
  - id: observe-peer-ack-initial-connection-expression
    languages: [rust]
    severity: INFO
    message: Complete Self struct expression with full initializer-expression metavariables; schema changes require review.
    patterns:
      - pattern-inside: 'fn new_inner(...) { ... }'
      - pattern: &peer_ack_connection_fields |
          Self {
            side: $INIT_SIDE,
            version: $INIT_VERSION,
            initial_dcid: $INIT_INITIAL_DCID,
            dcid: $INIT_DCID,
            scid: $INIT_SCID,
            peer_cid_adopted: $INIT_PEER_CID_ADOPTED,
            tls: $INIT_TLS,
            spaces: $INIT_SPACES,
            rtt: $INIT_RTT,
            cc: $INIT_CC,
            pacer: $INIT_PACER,
            pmtud: $INIT_PMTUD,
            mtu_probe_pn: $INIT_MTU_PROBE_PN,
            peer_ecn_ce: $INIT_PEER_ECN_CE,
            delivered: $INIT_DELIVERED,
            pto_count: $INIT_PTO_COUNT,
            probe_pending: $INIT_PROBE_PENDING,
            data_packets_sealed: $INIT_DATA_PACKETS_SEALED,
            zero_rtt_packets_sealed: $INIT_ZERO_RTT_PACKETS_SEALED,
            key_phase: $INIT_KEY_PHASE,
            next_packet_keys: $INIT_NEXT_PACKET_KEYS,
            previous_read_key: $INIT_PREVIOUS_READ_KEY,
            next_update_at: $INIT_NEXT_UPDATE_AT,
            key_update_soft_limit: $INIT_KEY_UPDATE_SOFT_LIMIT,
            sealed_packets: $INIT_SEALED_PACKETS,
            data_packets_open_failed: $INIT_DATA_PACKETS_OPEN_FAILED,
            handshake_done_pending: $INIT_HANDSHAKE_DONE_PENDING,
            handshake_confirmed: $INIT_HANDSHAKE_CONFIRMED,
            peer_ack_delay_exponent: $INIT_PEER_ACK_DELAY_EXPONENT,
            peer_max_ack_delay: $INIT_PEER_MAX_ACK_DELAY,
            peer_ack_params_applied: $INIT_PEER_ACK_PARAMS_APPLIED,
            peer_transport_params_prevalidated: $INIT_PEER_TRANSPORT_PARAMS_PREVALIDATED,
            discard_initial_after_ack: $INIT_DISCARD_INITIAL_AFTER_ACK,
            peer_addr_validated: $INIT_PEER_ADDR_VALIDATED,
            anti_amp_recv: $INIT_ANTI_AMP_RECV,
            anti_amp_sent: $INIT_ANTI_AMP_SENT,
            last_send_time: $INIT_LAST_SEND_TIME,
            keepalive_interval: $INIT_KEEPALIVE_INTERVAL,
            ping_pending: $INIT_PING_PENDING,
            write_level: $INIT_WRITE_LEVEL,
            zero_rtt_keys: $INIT_ZERO_RTT_KEYS,
            streams: $INIT_STREAMS,
            next_bidi: $INIT_NEXT_BIDI,
            next_uni: $INIT_NEXT_UNI,
            peer_streams_opened: $INIT_PEER_STREAMS_OPENED,
            recv_max_streams: $INIT_RECV_MAX_STREAMS,
            recv_max_streams_sent: $INIT_RECV_MAX_STREAMS_SENT,
            need_max_streams: $INIT_NEED_MAX_STREAMS,
            send_max_streams: $INIT_SEND_MAX_STREAMS,
            accept_bidi: $INIT_ACCEPT_BIDI,
            accept_uni: $INIT_ACCEPT_UNI,
            closed: $INIT_CLOSED,
            close_pending: $INIT_CLOSE_PENDING,
            close_sent: $INIT_CLOSE_SENT,
            close_time: $INIT_CLOSE_TIME,
            drained: $INIT_DRAINED,
            last_recv_time: $INIT_LAST_RECV_TIME,
            created_at: $INIT_CREATED_AT,
            send_max_data: $INIT_SEND_MAX_DATA,
            send_data_total: $INIT_SEND_DATA_TOTAL,
            recv_max_data: $INIT_RECV_MAX_DATA,
            recv_max_data_sent: $INIT_RECV_MAX_DATA_SENT,
            recv_data_total: $INIT_RECV_DATA_TOTAL,
            recv_data_consumed: $INIT_RECV_DATA_CONSUMED,
            recv_pending_total: $INIT_RECV_PENDING_TOTAL,
            need_max_data: $INIT_NEED_MAX_DATA,
            peer_flow_applied: $INIT_PEER_FLOW_APPLIED,
            peer_msd_bidi_local: $INIT_PEER_MSD_BIDI_LOCAL,
            peer_msd_bidi_remote: $INIT_PEER_MSD_BIDI_REMOTE,
            peer_msd_uni: $INIT_PEER_MSD_UNI,
          }
