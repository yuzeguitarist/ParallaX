  - id: observe-peer-ack-initial-connection-peer_ack_delay_exponent
    languages: [rust]
    severity: INFO
    message: Full field initializer expression, not a canonical prefix.
    patterns:
      - pattern-inside: 'fn new_inner(...) { ... }'
      - pattern: *peer_ack_connection_fields
      - focus-metavariable: $INIT_PEER_ACK_DELAY_EXPONENT
  - id: observe-peer-ack-initial-connection-peer_max_ack_delay
