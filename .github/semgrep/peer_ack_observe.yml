      - pattern-inside: 'fn read(...) { ... }'
      - pattern: 'tp.ack_delay_exponent = ...'
  - id: observe-peer-ack-parser-maximum
    languages: [rust]
    severity: INFO
    message: Direct reviewed effect, including nested scopes.
    patterns:
