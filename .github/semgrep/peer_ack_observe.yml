    languages: [rust]
    severity: INFO
    message: Complete reviewed initializer owner.
    patterns:
      - pattern-inside: 'impl TransportParameters { ... }'
      - pattern: 'fn read(...) { ... }'
  - id: observe-peer-ack-initial-parser-expression
