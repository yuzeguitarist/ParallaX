name: semgrep

# Pattern-based static analysis (Semgrep OSS) over the Rust sources. This overlaps
# with CodeQL by design and is kept narrow to the `p/rust` ruleset to avoid
# duplicating the secret-scanning (gitleaks) and Actions-audit (zizmor) coverage.
# The project-specific AST rules are blocking and regression-tested. The broad
# p/rust findings upload to the Security tab as supplementary, nonblocking SARIF.
#
# Semgrep is installed into a throwaway venv from hash-pinned requirements
# (.github/semgrep-requirements.txt, generated from semgrep-requirements.in via
# pip-compile --generate-hashes). Dependabot does not track pip packages in
# workflows, so bump the .in pin and regenerate the lockfile when desired.

on:
  pull_request:
    branches: [main, master]
    paths-ignore: ['**.md', 'ParallaX-DeepWiki/**']
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'ParallaX-DeepWiki/**']
  schedule:
    - cron: '29 5 * * 1'   # weekly (Mon 05:29 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    # All 13 blocking guards plus the supplementary scan must finish; the
    # complete-source mutations exceeded the former 20-minute runner budget.
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Semgrep
        run: |
          python3 -m venv /tmp/sg
          /tmp/sg/bin/pip install --quiet --require-hashes \
            -r .github/semgrep-requirements.txt
      - name: Blocking project security rules
        run: |
          python3 .github/scripts/check_crypto_rules.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_mldsa_buffers.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_client_activation.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_tls_drain.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_quic_packet_guards.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_quic_key_phase.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_quic_ack.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_peer_ack.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_mux_coalescing.py --semgrep /tmp/sg/bin/semgrep
          /tmp/sg/bin/python .github/scripts/check_mux_receipts.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_client_mux_tail.py --semgrep /tmp/sg/bin/semgrep
          python3 .github/scripts/check_mux_record_planning.py --semgrep /tmp/sg/bin/semgrep
          /tmp/sg/bin/python .github/scripts/check_replay_persistence.py --semgrep /tmp/sg/bin/semgrep
      # --error is omitted only for this supplementary ruleset.
      - name: Run Semgrep (p/rust) -> SARIF
        run: |
          # rust.lang.security.unsafe-usage is a blanket "you used `unsafe`" advisory
          # (note severity) that matches every `unsafe` keyword with no dataflow
          # analysis. This project's libc FFI (e.g. the QUIC GSO/GRO offload) is
          # required, audited, and carries SAFETY comments, so the rule is pure noise
          # here — exclude just that one rule, keeping the rest of p/rust active.
          /tmp/sg/bin/semgrep scan --config p/rust \
            --exclude-rule=rust.lang.security.unsafe-usage.unsafe-usage \
            --sarif --output semgrep.sarif .
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep
