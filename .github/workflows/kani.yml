name: kani

# Nightly Kani (bounded model checker) formal proofs over the most
# safety-critical scoped invariants: counter-nonce injectivity, outbound
# AEAD budgets, disjoint batch reservations, permanent failure state, and
# padding-length and TLS KeyUpdate parser safety, the client mux activation clock,
# QUIC replay, key-phase admission / ACK gates, protected PN allocation,
# exhausted-key close state, mux tail / record planning bounds, peer ACK
# decoding / canonical parameter parsing, SHAKE cache clearing, and sequential
# Open receipt publication claims. These
# are exhaustive within each harness's stated bounds and assumptions,
# complementing sampled property tests and the Miri UB lane. Kani builds its
# own toolchain + CBMC, so beyond the
# weekly baseline it runs on PRs/pushes only when proof-carrying
# files change (path-filtered below), not on every push.

on:
  # Narrow path-filtered gate: files that carry #[kani::proof] harnesses.
  # Kani installs CBMC + its own toolchain (tens of minutes), so
  # keep this tight to avoid long runs on unrelated changes; the weekly schedule
  # covers dependency drift.
  pull_request:
    branches: [main, master]
    paths:
      - 'src/crypto/session.rs'
      - 'src/crypto/replay.rs'
      - 'src/crypto/mldsa/fips202.rs'
      - 'src/protocol/data.rs'
      - 'src/protocol/command.rs'
      - 'src/traffic.rs'
      - 'src/client/runtime.rs'
      - 'src/tls/safari26.rs'
      - 'src/tls/quic/**'
      - 'src/transport/udp/quic/conn.rs'
      - 'src/transport/udp/quic/spaces.rs'
      - 'src/transport/udp/quic/transport_params.rs'
      - 'src/handshake/server.rs'
      - 'src/config.rs'
      - '.github/workflows/kani.yml'
  push:
    branches: [main, master]
    paths:
      - 'src/crypto/session.rs'
      - 'src/crypto/replay.rs'
      - 'src/crypto/mldsa/fips202.rs'
      - 'src/protocol/data.rs'
      - 'src/protocol/command.rs'
      - 'src/traffic.rs'
      - 'src/client/runtime.rs'
      - 'src/tls/safari26.rs'
      - 'src/tls/quic/**'
      - 'src/transport/udp/quic/conn.rs'
      - 'src/transport/udp/quic/spaces.rs'
      - 'src/transport/udp/quic/transport_params.rs'
      - 'src/handshake/server.rs'
      - 'src/config.rs'
      - '.github/workflows/kani.yml'
  schedule:
    - cron: '41 4 * * 1' # Mondays 04:41 UTC (offset from the miri lane)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Pin the Kani version so the weekly proof run is reproducible; bump
  # deliberately alongside local upgrades.
  KANI_VERSION: 0.67.0

jobs:
  kani:
    name: kani (nonce, budget, reservation, failure, parser, activation proofs)
    runs-on: ubuntu-latest
    # The complete 67-harness warm local run took about 47 minutes. Include
    # cold Kani setup and slower runners; protocol timeouts are unchanged.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: parallax-kani

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup

      # ACK-delay arithmetic harnesses select Z3 explicitly; Kani setup does
      # not install this external solver. Log the runner's packaged version.
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y z3
          z3 --version

      # Runs every #[kani::proof] harness in the crate. `cargo kani`
      # does NOT accept --locked (it errors "unexpected argument"); the committed
      # Cargo.lock is used by default, so the run stays reproducible.
      - name: cargo kani (all proof harnesses)
        run: cargo kani
