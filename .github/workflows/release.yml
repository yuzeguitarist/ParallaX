name: release

# Read-only native builders -> isolated attestation jobs -> one publisher.
# Dispatch must select the SAME version tag as the workflow ref so OIDC
# provenance identifies the exact source compiled by the build jobs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag; also select this tag in the Run workflow ref selector'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  resolve:
    name: validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
    steps:
      - name: Validate event ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch ]]
          [[ "$EVENT_REF" == "refs/tags/$EVENT_TAG" ]]
          [[ "$EVENT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ ${#EVENT_TAG} -le 100 ]]
          [[ -z "$INPUT_TAG" || "$INPUT_TAG" == "$EVENT_TAG" ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Resolve version
        id: ver
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EVENT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$head_commit" == "$tag_commit" && "$head_commit" == "$EVENT_COMMIT" ]]
          printf 'tag=%s\nversion=%s\ncommit=%s\n' "$RELEASE_TAG" "${RELEASE_TAG#v}" "$head_commit" >> "$GITHUB_OUTPUT"

  audit:
    name: enforce dependency source audits
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Resolve proves this immutable event commit is the selected tag.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.96.0'
      - run: cargo install --locked --version 0.10.3 cargo-vet
      - name: Require audited dependencies before release
        run: python3 scripts/security/dependencies.py check --report target/security/dependency-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: release-dependency-audits
          path: target/security/dependency-report.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: build ${{ matrix.target }}
    needs: [resolve, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep checkout authority tied to the event, not a job output.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.96.0'
          targets: ${{ matrix.target }}
      - name: Install pinned SBOM generator
        run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      - name: Build locked native binaries
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" --bin parallax --bin plx
      - name: Package binaries and target SBOMs
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ needs.resolve.outputs.commit }}
        run: python3 scripts/security/release_artifacts.py --tag "$TAG" --target "$TARGET" --commit "$SOURCE_SHA" --output "target/release-artifacts/$TARGET"
      - name: Run final stripped native binaries
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          "target/release-artifacts/$TARGET/parallax" --version
          "target/release-artifacts/$TARGET/plx" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: target/release-artifacts/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest ${{ matrix.target }}
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      # No checkout or source/build execution in this privileged job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-input
      - name: Validate release artifacts
        id: validate
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ needs.resolve.outputs.commit }}
          ARTIFACT_DIR: ${{ runner.temp }}/release-input
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, io, json, os, re, tarfile, uuid
          from graphlib import CycleError, TopologicalSorter
          from urllib.parse import unquote
          from pathlib import Path
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "duplicate JSON key")
                  result[key] = value
              return result
          def read_json(path):
              require(path.stat().st_size <= 16 * 1024 * 1024, "oversized JSON")
              return json.loads(path.read_text(), object_pairs_hook=unique)
          def sha(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          def bounded_text(value, limit=1024):
              return isinstance(value, str) and 0 < len(value) <= limit and all(ord(c) >= 32 and ord(c) != 127 for c in value)
          def properties(value):
              require(isinstance(value, list) and 1 <= len(value) <= 32, "invalid SBOM properties")
              for item in value:
                  require(isinstance(item, dict) and set(item) == {"name", "value"}, "invalid SBOM property")
                  require(bounded_text(item["name"], 128) and bounded_text(item["value"], 2048), "invalid SBOM property text")
              return unique((item["name"], item["value"]) for item in value)
          def crate_hash(component):
              hashes = component.get("hashes")
              require(isinstance(hashes, list) and len(hashes) == 1 and isinstance(hashes[0], dict),
                      "missing/invalid SBOM crate checksum")
              entry = hashes[0]
              require(set(entry) == {"alg", "content"} and entry["alg"] == "SHA-256"
                      and isinstance(entry["content"], str) and re.fullmatch(r"[0-9a-f]{64}", entry["content"]),
                      "missing/invalid SBOM crate checksum")
              return entry["content"]
          version_pattern = r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?"
          coverage = (
              "Cargo dependencies for this target and default release features, including "
              "build dependencies and excluding dev-only dependencies. Bundled native code "
              "is identified by the enclosing crate source checksum; its internal upstream "
              "components are not individually inventoried. OS/SDK libraries are external "
              "runtime dependencies; their installed versions are not asserted."
          )
          native_names = {"aws-lc-sys", "ring"}
          tag, target, commit = (os.environ[key] for key in ("RELEASE_TAG", "TARGET", "SOURCE_SHA"))
          require(re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", tag) and len(tag) <= 100, "invalid tag")
          require(target in ("x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"), "invalid target")
          require(re.fullmatch(r"[0-9a-f]{40}", commit), "invalid source commit")
          root = Path(os.environ["ARTIFACT_DIR"])
          name = f"parallax-{tag[1:]}-{target}"
          files = {"parallax", "plx", f"{name}.tar.gz", f"{name}.tar.gz.sha256",
                   f"{name}.parallax.cdx.json", f"{name}.plx.cdx.json", f"{name}.native.json"}
          manifest_name = f"{name}.manifest.json"
          require({path.name for path in root.iterdir()} == files | {manifest_name}, "unexpected/missing artifacts")
          for path in root.iterdir():
              require(path.is_file() and not path.is_symlink(), "non-regular artifact")
              require(0 < path.stat().st_size <= 512 * 1024 * 1024, "invalid artifact size")
          manifest = read_json(root / manifest_name)
          require(manifest["schema"] == 1 and manifest["tag"] == tag and manifest["target"] == target, "wrong manifest")
          require(manifest["source_commit"] == commit and manifest["source_ref"] == f"refs/tags/{tag}", "wrong source")
          require(manifest.get("coverage") == coverage, "wrong manifest coverage declaration")
          require(set(manifest["files"]) == files, "wrong manifest file set")
          require(re.fullmatch(r"[0-9a-f]{64}", manifest["cargo_lock_sha256"]), "invalid Cargo.lock digest")
          for filename, entry in manifest["files"].items():
              path = root / filename
              require(type(entry["size"]) is int and entry["size"] == path.stat().st_size, "size mismatch")
              require(entry["sha256"] == sha(path), "digest mismatch")
          require((root / f"{name}.tar.gz.sha256").read_text() == f"{sha(root / (name + '.tar.gz'))}  {name}.tar.gz\n", "wrong checksum file")
          # Bounded contract for the pinned producer, not a full schema audit or
          # proof that a compromised builder reports its components truthfully.
          native_sboms = {}
          cargo_versions = set()
          for binary in ("parallax", "plx"):
              bom = read_json(root / f"{name}.{binary}.cdx.json")
              require(isinstance(bom, dict) and bom.get("bomFormat") == "CycloneDX" and bom.get("specVersion") == "1.5", "wrong SBOM format")
              require(type(bom.get("version")) is int and bom["version"] == 1, "wrong SBOM version")
              binary_hash = sha(root / binary)
              identity = f"https://github.com/yuzeguitarist/ParallaX/{commit}/{target}/{binary}/sha256/{binary_hash}"
              require(bom.get("serialNumber") == uuid.uuid5(uuid.NAMESPACE_URL, identity).urn, "invalid/unbound SBOM serialNumber")
              metadata = bom.get("metadata")
              require(isinstance(metadata, dict), "invalid SBOM metadata")
              application = metadata.get("component")
              require(isinstance(application, dict) and application.get("name") == binary, "wrong SBOM binary")
              root_ref = f"urn:parallax:{commit}:{target}:{binary}"
              require(application.get("type") == "application" and application.get("version") == tag[1:]
                      and application.get("bom-ref") == root_ref
                      and application.get("purl") == f"pkg:github/yuzeguitarist/ParallaX@{commit}#{binary}", "wrong SBOM root")
              require(application.get("hashes") == [{"alg": "SHA-256", "content": binary_hash}], "SBOM binary mismatch")
              props = properties(metadata.get("properties"))
              require(props.get("parallax:source:commit") == commit and props.get("parallax:source:ref") == f"refs/tags/{tag}", "SBOM source mismatch")
              require(props.get("parallax:release:target") == target and props.get("cdx:rustc:sbom:target:triple") == target, "SBOM target mismatch")
              require(props.get("parallax:sbom:coverage") == coverage, "wrong SBOM coverage declaration")
              cargo_version = props.get("parallax:cargo:package-version")
              require(bounded_text(cargo_version, 128) and re.fullmatch(version_pattern, cargo_version), "invalid SBOM Cargo version")
              cargo_versions.add(cargo_version)
              components = bom.get("components")
              require(isinstance(components, list) and 1 <= len(components) <= 4096, "invalid SBOM components")
              refs, native_components = {root_ref}, {}
              for component in components:
                  require(isinstance(component, dict) and component.get("type") == "library", "invalid SBOM component")
                  crate, version, ref = (component.get(key) for key in ("name", "version", "bom-ref"))
                  require(bounded_text(crate, 128) and re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_-]*", crate), "invalid SBOM crate name")
                  require(bounded_text(version, 128) and re.fullmatch(version_pattern, version), "invalid SBOM crate version")
                  require(bounded_text(ref) and ref == f"registry+https://github.com/rust-lang/crates.io-index#{crate}@{version}"
                          and ref not in refs, "invalid/duplicate SBOM component ref")
                  require(bounded_text(component.get("purl"), 2048)
                          and unquote(component["purl"]) == f"pkg:cargo/{crate}@{version}", "invalid SBOM component purl")
                  checksum = crate_hash(component)
                  refs.add(ref)
                  if crate in native_names:
                      require(crate not in native_components, "ambiguous native SBOM component")
                      native_props = properties(component.get("properties"))
                      require(native_props.get("parallax:native:source-scope") ==
                              "Bundled native source and assembly identified by this crate checksum", "wrong native SBOM scope")
                      native_components[crate] = (version, checksum)
              dependencies = bom.get("dependencies")
              require(isinstance(dependencies, list) and len(dependencies) == len(refs), "invalid SBOM dependency graph")
              graph, edge_count = {}, 0
              for entry in dependencies:
                  require(isinstance(entry, dict) and set(entry) <= {"ref", "dependsOn"}, "invalid SBOM dependency entry")
                  ref, edges = entry.get("ref"), entry.get("dependsOn", [])
                  require(isinstance(ref, str) and ref in refs and ref not in graph, "invalid/duplicate SBOM graph ref")
                  require(isinstance(edges, list) and len(edges) <= len(refs), "invalid SBOM graph edges")
                  require(all(isinstance(edge, str) and edge in refs and edge != ref for edge in edges), "dangling/self SBOM graph edge")
                  require(len(set(edges)) == len(edges), "duplicate SBOM graph edge")
                  edge_count += len(edges)
                  require(edge_count <= 65536, "oversized SBOM dependency graph")
                  graph[ref] = edges
              require(set(graph) == refs and graph[root_ref], "missing SBOM root dependency edge")
              reached, pending = set(), [root_ref]
              while pending:
                  ref = pending.pop()
                  if ref not in reached:
                      reached.add(ref)
                      pending.extend(graph[ref])
              require(reached == refs, "unreachable SBOM component")
              try:
                  tuple(TopologicalSorter(graph).static_order())
              except CycleError:
                  require(False, "cyclic SBOM dependency graph")
              require(set(native_components) == native_names, "missing native SBOM components")
              native_sboms[binary] = native_components
          require(len(cargo_versions) == 1, "binary SBOM Cargo versions disagree")
          native = read_json(root / f"{name}.native.json")
          require(isinstance(native, dict) and set(native) == {"schema", "target", "coverage", "external_libraries", "bundled_sources"},
                  "missing/invalid native inventory fields")
          require(type(native["schema"]) is int and native["schema"] == 1 and native["target"] == target, "wrong native inventory")
          require(native["coverage"] == coverage, "wrong native coverage declaration")
          libraries = native["external_libraries"]
          require(isinstance(libraries, dict) and set(libraries) == {"parallax", "plx"}, "wrong native binary inventory")
          for values in libraries.values():
              require(isinstance(values, list) and 1 <= len(values) <= 256, "missing/invalid native library list")
              require(all(bounded_text(value, 2048) and value.strip() == value for value in values), "invalid native library name")
              require(len(set(values)) == len(values), "duplicate native library")
          bundles = native["bundled_sources"]
          require(isinstance(bundles, list) and len(bundles) == len(native_names), "missing/invalid native source bundles")
          declared = {}
          for bundle in bundles:
              require(isinstance(bundle, dict) and set(bundle) == {"crate", "version", "crate_sha256", "scope"}, "invalid native source bundle")
              crate = bundle["crate"]
              require(isinstance(crate, str) and crate in native_names and crate not in declared, "unexpected/duplicate native source bundle")
              require(bundle["scope"] == "Bundled source including native C/assembly; not a separate upstream audit", "wrong native bundle scope")
              require(bounded_text(bundle["version"], 128) and re.fullmatch(version_pattern, bundle["version"])
                      and isinstance(bundle["crate_sha256"], str) and re.fullmatch(r"[0-9a-f]{64}", bundle["crate_sha256"]), "invalid native source version/checksum")
              declared[crate] = (bundle["version"], bundle["crate_sha256"])
          require(set(declared) == native_names and all(value == declared for value in native_sboms.values()), "native inventory disagrees with binary SBOMs")
          # Read bounded archive data; never extract or execute downloaded files.
          # Bind the bytes users unpack to the separately signed binary SBOMs.
          with gzip.open(root / f"{name}.tar.gz", "rb") as compressed:
              archive_bytes = compressed.read(256 * 1024 * 1024 + 1)
          require(len(archive_bytes) <= 256 * 1024 * 1024, "oversized expanded archive")
          packaged = {"parallax", "plx", f"{name}.parallax.cdx.json", f"{name}.plx.cdx.json",
                      f"{name}.native.json", "README.md", "LICENSE", "NOTICE"}
          expected_members = {name} | {f"{name}/{item}" for item in packaged}
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:") as archive:
              seen = set()
              for member in archive:
                  require(member.name in expected_members and member.name not in seen, "unexpected/duplicate archive entry")
                  seen.add(member.name)
                  if member.name == name:
                      require(member.isdir() and member.mode == 0o755, "invalid archive root")
                      continue
                  require(member.type == tarfile.REGTYPE and 0 < member.size <= 128 * 1024 * 1024, "non-regular/oversized archive file")
                  filename = member.name[len(name) + 1:]
                  require(member.mode == (0o755 if filename in ("parallax", "plx") else 0o644), "unsafe archive mode")
                  if filename in files:
                      with archive.extractfile(member) as stream:
                          require(hashlib.file_digest(stream, "sha256").hexdigest() == sha(root / filename), "archive content mismatch")
              require(seen == expected_members, "missing archive entries")
              require(not any(archive_bytes[archive.offset:]), "data after archive end")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"prefix={name}\n")
          PY
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/release-input/*'
          create-storage-record: false
      - name: Attest parallax SBOM
        id: parallax-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/release-input/parallax'
          sbom-path: '${{ runner.temp }}/release-input/${{ steps.validate.outputs.prefix }}.parallax.cdx.json'
          create-storage-record: false
      - name: Attest plx SBOM
        id: plx-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/release-input/plx'
          sbom-path: '${{ runner.temp }}/release-input/${{ steps.validate.outputs.prefix }}.plx.cdx.json'
          create-storage-record: false
      - name: Preserve signing bundles
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-input
          PREFIX: ${{ steps.validate.outputs.prefix }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          PARALLAX_SBOM: ${{ steps.parallax-sbom.outputs.bundle-path }}
          PLX_SBOM: ${{ steps.plx-sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROVENANCE" "$ARTIFACT_DIR/$PREFIX.provenance.sigstore.jsonl"
          cp "$PARALLAX_SBOM" "$ARTIFACT_DIR/$PREFIX.parallax.sbom.sigstore.jsonl"
          cp "$PLX_SBOM" "$ARTIFACT_DIR/$PREFIX.plx.sbom.sigstore.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-${{ matrix.target }}
          path: '${{ runner.temp }}/release-input/*'
          if-no-files-found: error
          retention-days: 7

  publish:
    name: verify and publish complete release
    needs: [resolve, build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
      # Same workflow/run only. No source checkout, binary execution, or archive extraction.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-*
          path: ${{ runner.temp }}/release-assets
      - name: Verify attestations and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.commit }}
          ARTIFACT_DIR: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          def run(args):
              subprocess.run(args, check=True)
          tag, source, repo, ref = (os.environ[key] for key in ("RELEASE_TAG", "SOURCE_SHA", "GITHUB_REPOSITORY", "GITHUB_REF"))
          require(re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", tag) and len(tag) <= 100, "invalid tag")
          require(ref == f"refs/tags/{tag}" and re.fullmatch(r"[0-9a-f]{40}", source), "wrong event source")
          require(repo == "yuzeguitarist/ParallaX", "unexpected release repository")
          targets = ("x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin")
          root = Path(os.environ["ARTIFACT_DIR"])
          require({path.name for path in root.iterdir()} == {f"signed-{target}" for target in targets}, "missing/extra targets")
          assets = []
          for target in targets:
              directory = root / f"signed-{target}"
              require(directory.is_dir() and not directory.is_symlink(), "invalid target directory")
              name = f"parallax-{tag[1:]}-{target}"
              published = [f"{name}{suffix}" for suffix in (".tar.gz", ".tar.gz.sha256", ".parallax.cdx.json", ".plx.cdx.json", ".native.json", ".manifest.json")]
              bundles = [f"{name}{suffix}" for suffix in (".provenance.sigstore.jsonl", ".parallax.sbom.sigstore.jsonl", ".plx.sbom.sigstore.jsonl")]
              expected = set(published + bundles + ["parallax", "plx"])
              require({path.name for path in directory.iterdir()} == expected, "unexpected/missing signed files")
              for path in directory.iterdir():
                  require(path.is_file() and not path.is_symlink(), "non-regular signed artifact")
                  require(0 < path.stat().st_size <= 512 * 1024 * 1024, "invalid signed artifact size")
              common = ["--repo", repo, "--signer-workflow", f"{repo}/.github/workflows/release.yml",
                        "--source-ref", ref, "--source-digest", source, "--deny-self-hosted-runners"]
              for filename in published + ["parallax", "plx"]:
                  run(["gh", "attestation", "verify", str(directory / filename),
                       "--bundle", str(directory / bundles[0]), *common])
              for binary in ("parallax", "plx"):
                  run(["gh", "attestation", "verify", str(directory / binary), "--bundle",
                       str(directory / f"{name}.{binary}.sbom.sigstore.jsonl"),
                       "--predicate-type", "https://cyclonedx.org/bom", *common])
              assets.extend(str(directory / filename) for filename in published + bundles)
          # Resolve the exact remote tag namespace, including annotated tags. Do not use
          # the ambiguous commits/<name> API, which can select a same-named branch.
          def check_tag():
              response = subprocess.check_output(["gh", "api", f"repos/{repo}/git/ref/tags/{tag}"], text=True)
              obj = json.loads(response)["object"]
              for _ in range(8):
                  if obj["type"] == "commit":
                      break
                  require(obj["type"] == "tag" and re.fullmatch(r"[0-9a-f]{40}", obj["sha"]), "unexpected tag object")
                  response = subprocess.check_output(["gh", "api", f"repos/{repo}/git/tags/{obj['sha']}"], text=True)
                  obj = json.loads(response)["object"]
              require(obj["type"] == "commit" and obj["sha"] == source, "release tag moved after build")
          check_tag()
          # Creation fails on any existing release; never overwrite published bytes.
          # A failed upload leaves a draft for explicit maintainer inspection.
          run(["gh", "release", "create", tag, *assets, "--repo", repo, "--verify-tag",
               "--draft", "--generate-notes", "--title", tag])
          # A separate tag check cannot close the check/publish race. Require
          # GitHub to prevent tag updates AND deletion, with no bypass actors.
          # The workflow only observes policy; it never changes repository rules.
          # Missing policy or API permissions leave the verified assets in draft.
          pages = json.loads(subprocess.check_output([
              "gh", "api", "--paginate", "--slurp",
              f"repos/{repo}/rulesets?includes_parents=false&per_page=100"], text=True))
          protected = False
          for entry in (entry for page in pages for entry in page):
              if entry.get("target") != "tag" or entry.get("enforcement") != "active":
                  continue
              rule_id = entry.get("id")
              require(type(rule_id) is int and rule_id > 0, "invalid tag ruleset id")
              ruleset = json.loads(subprocess.check_output([
                  "gh", "api", f"repos/{repo}/rulesets/{rule_id}"], text=True))
              conditions = ruleset.get("conditions", {}).get("ref_name", {})
              # Deliberately accept only unambiguous release-tag patterns.
              # Arbitrary fnmatch syntax has different semantics on GitHub.
              includes = conditions.get("include", [])
              excludes = conditions.get("exclude", [])
              matches = any(pattern in ("~ALL", ref, "refs/tags/v*") for pattern in includes)
              kinds = {rule.get("type") for rule in ruleset.get("rules", [])}
              if (ruleset.get("target") == "tag" and ruleset.get("enforcement") == "active"
                      and ruleset.get("bypass_actors") == [] and matches and excludes == []
                      and {"update", "deletion"} <= kinds):
                  protected = True
                  break
          require(protected, "release stays draft: active non-bypassable tag update/deletion protection required")
          # Catch any movement before protection became effective. GitHub's
          # enforced rule, rather than this observation, closes the final race.
          check_tag()
          run(["gh", "release", "edit", tag, "--repo", repo, "--draft=false"])
          PY
