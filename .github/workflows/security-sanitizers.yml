name: security-sanitizers

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/security/**'
      - 'verification/sanitizers/**'
      - '.github/workflows/security-sanitizers.yml'
  push:
    branches: [main, master, 'g2l/security-*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/security/**'
      - 'verification/sanitizers/**'
      - '.github/workflows/security-sanitizers.yml'
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-sanitizers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  PYTHONUNBUFFERED: '1'

jobs:
  sanitizer:
    name: ${{ matrix.kind }} runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [address, thread, leak]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: nightly-2026-06-17
          components: rust-src
      - name: Native compiler and symbolizer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm llvm-dev cmake ninja-build
      - name: Canaries and instrumented ParallaX workloads
        env:
          SANITIZER: ${{ matrix.kind }}
        run: python3 scripts/security/sanitizers.py "$SANITIZER"
      - name: Retain scope, diagnostics and reproduction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-${{ matrix.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/security/sanitizers/${{ matrix.kind }}/*.log
            target/security/sanitizers/${{ matrix.kind }}/report.json
            target/security/tsan-runtime/*.log
            target/security/tsan-runtime/report.json
          if-no-files-found: error
          retention-days: 10
