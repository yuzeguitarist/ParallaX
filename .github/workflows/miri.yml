name: miri

# Nightly Miri (undefined-behavior interpreter) over the FFI-free pure-logic
# modules: the QUIC varint/frame codecs, the padding math, and the protocol command
# codecs -- the untrusted-input parsers and arithmetic where a UB bug (OOB
# slice, integer-overflow-derived index, invalid-value transmute) would be most
# dangerous. The crypto, TLS-record and relay paths call FFI or network syscalls,
# which Miri cannot execute, so they are intentionally excluded here
# and covered by the fuzz suite + loopback tests instead. Miri is slow, so beyond
# the weekly baseline it runs on PRs/pushes only when one of the pure-logic
# modules it covers changes (path-filtered below), not on every push.

on:
  # Path-filtered gate: run only when one of the FFI-free pure-logic modules Miri
  # actually exercises changes (see the run filter at the bottom of this file).
  pull_request:
    branches: [main, master]
    paths:
      - 'src/transport/udp/quic/varint.rs'
      - 'src/transport/udp/quic/frame.rs'
      - 'src/traffic.rs'
      - 'src/protocol/command.rs'
      - '.github/workflows/miri.yml'
  push:
    branches: [main, master]
    paths:
      - 'src/transport/udp/quic/varint.rs'
      - 'src/transport/udp/quic/frame.rs'
      - 'src/traffic.rs'
      - 'src/protocol/command.rs'
      - '.github/workflows/miri.yml'
  schedule:
    - cron: '37 4 * * 1' # Mondays 04:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miri-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  miri:
    name: miri (pure-logic modules)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly Rust + Miri
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
          components: miri

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: parallax-miri

      # Pure-logic modules only (no crypto FFI or network syscalls on these paths).
      # disable-isolation lets the deterministic StdRng/time helpers run.
      - name: cargo miri test (varint + frame + padding + command codecs)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        shell: bash
        run: |
          for test_filter in \
            'transport::udp::quic::varint::' \
            'transport::udp::quic::frame::' \
            'traffic::' \
            'protocol::command::'
          do
            # libtest ORs multiple filters, so check each module separately:
            # a stale filter must fail even when the other modules have tests.
            test_list="$(cargo +nightly miri test --locked --lib -- "$test_filter" --list)"
            printf '%s\n' "$test_list"
            if ! grep -q ': test$' <<< "$test_list"; then
              echo "::error::Miri filter matched no tests: $test_filter"
              exit 1
            fi
            cargo +nightly miri test --locked --lib -- "$test_filter"
          done
