name: proverif

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'verification/proverif/**'
      - 'src/crypto/identity.rs'
      - 'src/crypto/pq.rs'
      - 'src/crypto/session.rs'
      - 'src/handshake/client.rs'
      - 'src/handshake/server.rs'
      - 'src/handshake/transcript.rs'
      - 'src/client/runtime.rs'
      - 'src/protocol/command.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/proverif.yml'
  push:
    branches: [main, master]
    paths:
      - 'verification/proverif/**'
      - 'src/crypto/identity.rs'
      - 'src/crypto/pq.rs'
      - 'src/crypto/session.rs'
      - 'src/handshake/client.rs'
      - 'src/handshake/server.rs'
      - 'src/handshake/transcript.rs'
      - 'src/client/runtime.rs'
      - 'src/protocol/command.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/proverif.yml'
  schedule:
    - cron: '17 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proverif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-rekey:
    name: symbolic identity/rekey slice (positive and negative controls)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OCaml compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ocaml
      - name: Fetch and verify pinned official ProVerif source
        run: |
          curl --fail --location --retry 3 \
            https://bblanche.gitlabpages.inria.fr/proverif/proverif2.05.tar.gz \
            --output /tmp/proverif2.05.tar.gz
          echo '4871f53c32ab4a04669a060c4886ba5d9080496963fb980a9a62d2c429ceabc4  /tmp/proverif2.05.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/proverif2.05.tar.gz -C /tmp
      - name: Build verifier without interactive dependencies
        working-directory: /tmp/proverif2.05
        run: ./build -nointeract
      - name: Check result parser and source mapping guards
        run: python3 -B -m unittest discover -s verification/proverif -p 'test_*.py'
      - name: Verify slice and require detected protocol mutations
        run: python3 -B verification/proverif/run.py --proverif /tmp/proverif2.05/proverif
      - name: Save model, verifier hashes and proof/attack traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proverif-${{ github.sha }}
          path: target/proverif/
          if-no-files-found: error
