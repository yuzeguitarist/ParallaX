name: cargo-deny

# Advisory, source, and license checks cover every third-party Cargo workspace.
# The std-only sanitizer fixture is enforced by dependency-assurance's inventory.
on:
  pull_request:
    paths: ['**/Cargo.toml', '**/Cargo.lock', Cargo.toml, Cargo.lock, deny.toml, '.github/workflows/cargo-deny.yml']
  push:
    branches: [main, master, 'g2l/security-*']
    paths: ['**/Cargo.toml', '**/Cargo.lock', Cargo.toml, Cargo.lock, deny.toml, '.github/workflows/cargo-deny.yml']
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-deny-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo deny ${{ matrix.manifest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, fuzz/Cargo.toml, ci/gfw-lab/Cargo.toml, verification/concurrency/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: '1.96.0'
      - name: Install pinned cargo-deny
        run: cargo install --locked --version 0.19.9 cargo-deny
      - name: Check complete feature graph
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: cargo deny --locked --all-features --manifest-path "$MANIFEST" check --config deny.toml
